<header-logged-in [isMobile]="isMobile()" (callback)="toggleNavBar()"/>

<nav-bar-component [hideCloseButton]="!isMobile()"
                   [class.takeAll]="isMobile()"
                   (callback)="toggleNavBar()"
                   [class.visible]="showNavBar()" />

<overlay-component (callback)="toggleNavBar()" [activate]="showNavBar() && isMobile()"/>
<main>
  <h1>Únete a una campaña</h1>

  <label for="idSession"></label><input id="idSession" placeholder="ID de la campaña">
  <label for="sessionPassword"></label><input id="sessionPassword" placeholder="Contraseña de la campaña">

  <div id="buttons">
    <button (click)="goToAllSessions()">
      Cancelar
    </button>


    <button (click)="goToPlayerCampaign()">
      Aceptar
    </button>
  </div>

</main>
