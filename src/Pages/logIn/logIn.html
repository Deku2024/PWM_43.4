<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Macondo&display=swap" rel="stylesheet">
  <script type="module" src="logIn.js"></script>
  <link rel="stylesheet" href="logIn.css">
  <link rel="stylesheet" href="../../palette.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>

<header id="header"></header>

<main id="Main">

  <img src="../../Assets/logInSignInImage.png" alt="Logo" width="300" height="150">

  <h1>
    Inicio de Sesión
  </h1>
  <form novalidate id="logIn-form">
    <div class="input">
      <label for="firstInput"></label>
      <input placeholder="Nombre de usuario" id="firstInput" type="text">
    </div>

    <div class="input">
      <label for="lastInput"></label>
      <input placeholder="Contraseña" id="lastInput" type="password">
    </div>

    <div class="error"></div>


    <button type="submit" id="acceptButton" class="mainButton">
        Iniciar sesion
    </button>

  </form>

  <div id="otherOptions">
    <a href="../index/index.html" class="link">
      <button id="cancelButton" class="mainButton">
        Cancelar
      </button>
    </a>

    <a href="../signIn/signIn.html" class="link">
      ¿No tienes cuenta? Regístrate
    </a>
  </div>

</main>

<footer id="footer"></footer>

</body>
</html>
