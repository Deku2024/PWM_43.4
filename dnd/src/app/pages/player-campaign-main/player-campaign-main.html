<header-logged-in [inCampaign]="true"/>

<main>
  @if (isPlayerSideBarBeingShow()) {
    <player-side-bar-component (callback)="goBack()" [hideButton]="mediaQuery()"/>
  }

  <div id="sessionArea">

    <section id="leftSection">
      <div id="characterImageContainer">
        <label for="characterImageUpload">
          <img src="../../Assets/sheet_img_example.png" alt="Character's Image (click to change)">
        </label>
        <input type="file" id="characterImageUpload" accept="image/*" style="display: none;">
      </div>
      <div id="characteristicsGroup">
        <dice-roller-component [tittle]="'STR'" />
        <dice-roller-component [tittle]="'DEX'" />
        <dice-roller-component [tittle]="'CON'" />
        <dice-roller-component [tittle]="'INT'" />
        <dice-roller-component [tittle]="'WIS'" />
        <dice-roller-component [tittle]="'CHR'" />
      </div>

      <button class="dropDownButton">Inventario <span>></span></button>
      <button class="dropDownButton">Habilidades de clase <span>></span></button>
      <button class="dropDownButton">Habilidades <span>></span></button>

    </section>
    <section id="rightSection">
      <form class="rightSectionWrapper">
        <label for="characterName"> <input class="firstField" id="characterName" type="text" placeholder="Nombre"> </label>
        <label for="characterRace"> <input class="secondField" id="characterRace" type="text" placeholder="Raza"> </label>
        <label for="characterAge"> <input class="thirdField" id="characterAge" type="text" placeholder="Edad"> </label>
      </form>

      <form class="rightSectionWrapper">
        <label for="characterClasses"> <input class="firstField" id="characterClasses" type="text" placeholder="Clases"> </label>
        <label for="characterExperience"> <input class="secondField" id="characterExperience" type="text" placeholder="Experiencia"> </label>
        <label for="characterAligment"> <input class="thirdField" id="characterAligment" type="text" placeholder="Alineamiento">  </label>
      </form>

      <form id="miscCharacterValues" class="rightSectionWrapper">
        <label for="salvationThrows"><input id="salvationThrows" type="text" placeholder="Tiradas de salvación"></label>

        <field-with-value-component [tittle]="'Vida'" [placeholder]="'Vida'" />
        <field-with-value-component [tittle]="'Vida máx'" [placeholder]="'Vida máx.'" />
        <field-with-value-component [tittle]="'Vida temp'" [placeholder]="'Vida temp.'" />
      </form>

      <label for="characterDescription"><textarea placeholder="Descripción" id="characterDescription"></textarea></label>

    </section>
  </div>

  @if (isBottomMenuBeingShow()) {
    <drop-down-menu-component />
  }

  @if (isAnythingbeingShown() && this.mediaQuery()) {
    <overlay-component [activate]="isAnythingbeingShown()" (callback)="interactMenu(0)"/>
  }

  @if (isLogThrowsBeingShow()) {
    <log-tiradas-component [class.show]="isLogThrowsBeingShow()" [isMenuBeingShow]="isLogThrowsBeingShow()" />
  }
</main>

@if (mediaQuery()) {
  <campaign-footer-component
    (click)="updateIsAnythingbeingShown()"
    (usersClicked)="interactMenu(2)"
    (diceClicked)="interactMenu(1)"
    (arrowClicked)="interactMenu(3)"
  />
}
