<app-header></app-header>

<ion-content>
  <main id="Main">
    <img src="/assets/logInSignInImage.png" alt="Logo" width="300" height="150">
    <h1>Inicio de Sesión</h1>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" id="logIn-form">
      <div class="input">
        <label for="firstInput"></label>
        <input
          formControlName="email"
          placeholder="Correo electrónico"
          id="firstInput"
          type="email">
      </div>

      <div class="input">
        <label for="lastInput"></label>
        <input
          formControlName="password"
          placeholder="Contraseña"
          id="lastInput"
          type="password">
      </div>

      @if (loginForm.get('email')?.errors && loginForm.get('email')?.touched) {
        <p style="color: red;">Ingresa un correo válido</p>
      }

      @if (errorMessage){
        <p style="color: red;">{{ errorMessage }}</p>
      }

      <ion-button type="submit" [disabled]="loginForm.invalid" class="mainButton">Iniciar sesión</ion-button>
    </form>
    <div class="otherOptions">
      <ion-button (click)="goToHome()" class="mainButton">Cancelar</ion-button>
      <a routerLink="/signIn" class="link">¿No tienes cuenta? Regístrate</a>
    </div>
  </main>
</ion-content>

<app-footer></app-footer>
