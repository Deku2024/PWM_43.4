<app-header></app-header>

<ion-content [fullscreen]="true">

  <main id="Main">

    <img
      src="/assets/logInSignInImage.png"
      alt="Logo"
      width="275"
      height="125">

    <h1>Regístrate</h1>

    <form
      [formGroup]="signInForm"
      (ngSubmit)="onRegister()">

      <div class="input-control">

        <ion-input
          formControlName="username"
          placeholder="Nombre de Usuario"
          type="text"
          fill="outline">
        </ion-input>

      </div>

      <div class="input-control">

        <ion-input
          formControlName="email"
          placeholder="Correo Electrónico"
          type="email"
          fill="outline">
        </ion-input>

      </div>

      <div class="input-control">

        <ion-input
          formControlName="password"
          placeholder="Contraseña"
          type="password"
          fill="outline">
        </ion-input>

      </div>

      <div class="input-control">

        <ion-input
          formControlName="repeatpassw"
          placeholder="Repita Contraseña"
          type="password"
          fill="outline">
        </ion-input>

      </div>

      @if (
        signInForm.hasError('passwordMismatch') &&
        signInForm.get('repeatpassw')?.touched
        ) {

        <p class="error-text">
          Las contraseñas no coinciden
        </p>

      }

      <ion-button
        type="submit"
        [disabled]="signInForm.invalid"
        class="mainButton">

        Registrarse

      </ion-button>

    </form>

    <div class="otherOptions">

      <ion-button
        fill="outline"
        (click)="router.navigate(['/index'])"
        class="mainButton">

        Cancelar

      </ion-button>

      <a
        routerLink="/logIn"
        class="link">

        ¿Ya tienes cuenta? Inicia sesión

      </a>

    </div>

  </main>

</ion-content>

<app-footer></app-footer>
