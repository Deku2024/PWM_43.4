<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Macondo&display=swap" rel="stylesheet">
  <script type="module" src="signIn.js"></script>
  <link rel="stylesheet" href="signIn.css">
  <link rel="stylesheet" href="../../Styles/palette.css">
  <link rel="stylesheet" href="../../Styles/footer-headerWbuttons.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>

<header id="header"></header>

<main id="Main">

  <img src="../../Assets/logInSignInImage.png" alt="Logo" width="275" height="125">

  <h1>
    Regístrate
  </h1>

  <form id="signIn-form" novalidate>
    <div class="input-control">
      <label for="username"></label>
      <input id="username" name="username" placeholder="Nombre de Usuario"  type="text" minlength="6" maxlength="25" pattern="^[A-Za-z0-9._\-]+$" required>
      <div class="error-message" id="usernameError"></div>
    </div>

    <div class="input-control">
      <label for="email"></label>
      <input id="email" name="username" placeholder="Correo Electrónico"  type="email" required>
      <div class="error-message" id="emailError"></div>
    </div>

    <div class="input-control">
      <label for="password"></label>
      <input id="password" name="password" placeholder="Contraseña"  type="password" minlength="8" maxlength="15" required>
      <div class="error-message" id="passwordError"></div>
    </div>

    <div class="input-control">
      <label for="repeatpassw"></label>
      <input id="repeatpassw" name="repeatpassw" placeholder="Repita Contraseña"  type="password" required>
      <div class="error-message" id="repeatpasswError"></div>
    </div>

    <button id="acceptButton" class="mainButton" type="submit">
      Registrarse
    </button>

  </form>

  <div class="otherOptions">
    <a href="../index/index.html" class="link">
      <button id="cancelButton" class="mainButton">
        Cancelar
      </button>
    </a>

    <a href="../logIn/logIn.html" class="link">
      ¿Ya tienes cuenta? Inicia sesión
    </a>
  </div>


</main>

<footer id="footer"></footer>
</body>
</html>
