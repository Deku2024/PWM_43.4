<app-header></app-header>

<main id="Main">
  <img src="../../Assets/logInSignInImage.png" alt="Logo" width="300" height="150">

  <h1>Inicio de Sesión</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" id="logIn-form">

    <div class="input">
      <label for="firstInput"></label>
      <input
        formControlName="email"
        placeholder="Correo electrónico"
        id="firstInput"
        type="email">
    </div>

    <div class="input">
      <label for="lastInput"></label>
      <input
        formControlName="password"
        placeholder="Contraseña"
        id="lastInput"
        type="password">
    </div>

    @if (loginForm.get('email')?.errors && loginForm.get('email')?.touched) {
      <div class="error">Ingresa un correo válido</div>
    }

    <button
      type="submit"
      id="acceptButton"
      class="mainButton"
      [disabled]="loginForm.invalid">
      Iniciar sesión
    </button>
  </form>

  <div class="otherOptions">
    <button (click)="goToHome()" id="cancelButton" class="mainButton">Cancelar</button>
    <a routerLink="/signIn" class="link">¿No tienes cuenta? Regístrate</a>
  </div>
</main>

<app-footer></app-footer>
