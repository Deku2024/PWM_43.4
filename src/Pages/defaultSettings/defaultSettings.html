<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Default Settings</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script type="module" src="../../auxiliar-script.js"></script>
  <script type="module" src="defaultSettings.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link rel="stylesheet" href="defaultSettings.css">
  <link rel="stylesheet" href="../../palette.css">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Macondo&display=swap" rel="stylesheet">
</head>
<body>

<header></header>

<nav></nav>

<main>

  <h1>Ajustes por defecto de la sesión</h1>

  <div id="left">
      <form class="field">
        <div class="setting">
          <label for="tamaño-log"></label>
          <input id="tamaño-log" type="number" placeholder="Tamaño log tiradas">
        </div>

        <div class="setting">
          <label for="max-jugadores"></label>
          <input id="max-jugadores" type="number" placeholder="Máximo de jugadores">
        </div>

        <div class="setting">
          <label class="checkbox-label">
            <span>Aceptar automáticamente solicitudes de unión</span>
            <input id="auto-aceptar" type="checkbox">
          </label>
        </div>

        <div class="setting">
          <label for="nivel-comienzo"></label>
          <input id="nivel-comienzo" type="number" placeholder="Nivel de comienzo de la campaña">
        </div>
      </form>

    <form class="field" >

      <label id="objects">Objetos de inicio de campaña</label>
        <input type="text">


    </form>
  </div>

</main>
<div id="overlay" onclick="changeNavBarVisibility()"></div>
</body>
</html>
