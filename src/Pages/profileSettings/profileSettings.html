<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Macondo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../palette.css">
  <link rel="stylesheet" href="profileSettings.css">
</head>
<body>

<header>
  <a href="../index/index.html" class="image"><img id="headerLogo" src="../../Assets/aspasheader.png" class="imagen"></a>
</header>

<main>
  <h1>Ajustes de perfil</h1>

  <form id="mainForm">

    <div id="userIconImageContainer">
      <label for="profileImageUpload">
        <img src="../../Assets/default_user_icon.png" alt="Profile Picture (click to change)">
      </label>
      <input type="file" id="profileImageUpload" accept="image/*" style="display: none;">
    </div>

    <div id="formFieldsGroups">

      <label> Nombre de usuario
        <input type="text">
      </label>

      <label> Correo
        <input type="text">
      </label>

      <label> Contraseña
        <input type="text">
      </label>

    </div>

  </form>

  <div id="buttons">
    <button id="firstButton">Cancelar</button>
    <button id="restablishButton">Restablecer</button>
    <a id="acceptButton" href="../allSessions/allSessions.html"><button class="link">Aceptar</button></a>
  </div>

</main>


</body>
</html>
