<header-logged-in [isMobile]="isMobile()" (callback)="toggleNavBar()"/>

<nav-bar-component [hideCloseButton]="!isMobile()"
                   [class.takeAll]="isMobile()"
                   (callback)="toggleNavBar()"
                   [class.visible]="showNavBar()" />

<overlay-component (callback)="toggleNavBar()" [activate]="showNavBar() && isMobile()"/>

<ion-content id="main-content">

  <ion-grid>

    <ion-row>
      <ion-col size="12">

        <h1>Tus campañas</h1>

      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">

        <ion-button
          expand="block"
          id="joinSession"
          (click)="goToJoinSession()">

          Unirse a campaña

        </ion-button>

      </ion-col>
    </ion-row>

    <ion-row>

      @for (session of sessions(); track $index) {

        <ion-col
          size="12"
          sizeMd="6"
          sizeLg="4">

          <app-session-menu-component
            [session]="session">
          </app-session-menu-component>

        </ion-col>

      }

    </ion-row>

  </ion-grid>

</ion-content>
