<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <script type="module" src="logIn_signIn.js"></script>
  <link rel="stylesheet" href="logIn_signIn.css">
</head>
<body>

<header id="header"></header>

<main id="Main">

  <img src="../../Assets/d20.png" alt="Logo" width="300" height="100">

  <h1>
    Inicio de Sesión
  </h1>
  <form novalidate action="/" id="logIn-form">
    <div class="input">
      <label for="firstInput"></label>
      <input placeholder="Nombre de usuario" id="firstInput" type="text">
    </div>

    <div class="input">
      <label for="lastInput"></label>
      <input placeholder="Contraseña" id="lastInput" type="password">
    </div>

    <div class="error-message"></div>


    <button type="submit" id="acceptButton" class="mainButton">
        Iniciar sesion
    </button>

  </form>


  <div id="ButtonDiv">

    <a href="../index/index.html" class="link">
      <button id="cancelButton" class="mainButton">
        Cancelar
      </button>
    </a>


    <p>
      Lorem ipsum dolor sit amet
    </p>

    <a href="./signIn.html" class="link">
      <button class="swtichButton">
        Botón
      </button>
    </a>

  </div>

</main>

<footer id="footer"></footer>

</body>
</html>
